- stage: Build
  jobs:
  - job: BuildDockerImage
    steps:
    - task: Docker@2
      inputs:
        command: build
        Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(Build.BuildId)
      displayName: 'Build Docker image'

- stage: Push
  jobs:
  - job: PushDockerImage
    steps:
    - task: Docker@2
      inputs:
        command: login
        containerRegistry: 'dockerRegistryConnection' # Azure DevOps Service Connection for Docker Registry
        displayName: 'Login to Docker Registry'

    - task: Docker@2
      inputs:
        command: push
        repository: 'eeba19/cicd-backend'
        tags: |
          $(Build.BuildId)
      displayName: 'Push Docker image to registry'
